[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waybar2qs"
version = "0.1.0"
description = "Transpile Waybar (config.jsonc + style.css) into modular Quickshell (shell.qml) projects"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "waybar2qs contributors"}
]
requires-python = ">=3.10"
keywords = ["waybar", "quickshell", "qml", "hyprland", "niri", "omarchy", "wayland", "transpiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Prateek-squadron/waybar2qs"
Repository = "https://github.com/Prateek-squadron/waybar2qs"

[project.scripts]
waybar2qs = "waybar2qs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
